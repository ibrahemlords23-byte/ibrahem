version: '3.8'

services:
  # Using Neon Database (Cloud PostgreSQL)
  # No local PostgreSQL needed

  # Backend API
  backend:
    build: ./backend
    container_name: ibrahim-backend
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_SRoDGZ42qWFp@ep-billowing-band-adhuxspr-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      JWT_SECRET: your-super-secret-jwt-key-here-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-here-change-in-production
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    # No dependency on local postgres since we're using Neon
    networks:
      - ibrahim-network
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend
  frontend:
    build: ./frontend
    container_name: ibrahim-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ibrahim-network

# No volumes needed since we're using Neon cloud database

networks:
  ibrahim-network:
    driver: bridge
